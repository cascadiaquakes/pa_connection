<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico">
    <title>P&A connections</title>
</head>
<body>
<div id="app">
    <aside class="sidebar">
        <!-- Tabs header -->
        <div class="sidebar-tabs" role="tablist" aria-label="Sidebar tabs">
            <button
                    type="button"
                    class="tab active"
                    id="tabSettings"
                    role="tab"
                    aria-selected="true"
                    aria-controls="panelSettings"
            >
                Settings
            </button>

            <button
                    type="button"
                    class="tab"
                    id="tabInfo"
                    role="tab"
                    aria-selected="false"
                    aria-controls="panelInfo"
            >
                Info
            </button>
            <button
                    type="button"
                    class="tab"
                    id="tabExport"
                    role="tab"
                    aria-selected="false"
                    aria-controls="panelExport"
            >
                Export
            </button>
            <button
                    type="button"
                    class="tab"
                    id="tabSearch"
                    role="tab"
                    aria-selected="false"
                    aria-controls="panelSearch"
            >
                Search
            </button>
        </div>

        <!-- Tabs content -->
        <div class="tab-panels">
            <!-- SETTINGS -->
            <div
                    class="tab-panel active"
                    id="panelSettings"
                    role="tabpanel"
                    aria-labelledby="tabSettings"
            >
                <section class="panel">
                    <h3>Coloring</h3>

                    <label class="row">
                        <span>Nodes</span>
                        <select id="nodeColorMode">
                            <option value="orgCat">Organization Category</option>
                            <option value="geo">Geographic Area</option>
                            <option value="none">None</option>
                        </select>
                    </label>

                    <label class="row">
                        <span>Edges</span>
                        <select id="edgeDisplayMode">
                            <option value="simplified">Simplified</option>
                            <option value="detailed">Detailed</option>
                        </select>
                    </label>
                </section>

                <!-- Node Filters -->
                <section class="panel">
                    <h3>Node filters</h3>

                    <div class="hint">Organization Category</div>
                    <div id="orgCategoryFilters" class="checklist"></div>

                    <div class="hint" style="margin-top: 10px;">Geographic Area</div>
                    <div id="geoFilters" class="checklist"></div>
                </section>

                <!-- Edge Filters -->
                <section class="panel">
                    <h3>Edge filters</h3>

                    <div class="hint">Relationship type</div>
                    <div id="relTypeFilters" class="checklist"></div>
                </section>

                <section class="panel">
                    <h3>Graph</h3>

                    <label class="switch">
                        <input type="checkbox" id="togglePrune" checked />
                        <span class="slider" aria-hidden="true"></span>
                        <span class="switch-label">Prune isolated nodes</span>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="toggleLayout"/>
                        <span class="slider" aria-hidden="true"></span>
                        <span class="switch-label">Self Organizing Layout</span>
                    </label>
                </section>
            </div>

            <!-- INFO -->
            <div
                    class="tab-panel"
                    id="panelInfo"
                    role="tabpanel"
                    aria-labelledby="tabInfo"
                    hidden
            >
                <section class="panel">
                    <h3>Selection</h3>
                    <div id="infoSelection"></div>
                </section>
                <section class="panel">
                    <h3>Graph stats</h3>
                    <div id="infoStatus"></div>
                </section>

            </div>
            <div
                    class="tab-panel"
                    id="panelExport"
                    role="tabpanel"
                    aria-labelledby="tabExport"
                    hidden
            >
                <section class="panel">
                    <h3>Export graph</h3>
                    <button id="btnExportJson" type="button">Download all JSON</button>

                    <div id="exportStatus" class="hint" style="margin-top: 10px;"></div>
                </section>
            </div>
            <div
                    class="tab-panel"
                    id="panelSearch"
                    role="tabpanel"
                    aria-labelledby="tabSearch"
                    hidden
            >
                <section class="panel">
                    <h3>Search organizations</h3>

                    <label class="row" for="searchInput" style="display:block;">
                        <span class="hint">Search across name, ID, type, geography, notes, and contacts</span>
                        <input
                                id="searchInput"
                                type="text"
                                placeholder="Type to search organizations..."
                                autocomplete="off"
                                spellcheck="false"
                                style="width: 100%; margin-top: 8px;"
                        />
                    </label>

                    <div id="searchCount" class="hint" style="margin-top: 10px;">0 results</div>
                    <div id="searchResults" class="search-results" style="margin-top: 10px;"></div>
                </section>
            </div>
        </div>
    </aside>
    <div
            id="sidebarResizer"
            class="sidebar-resizer"
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize sidebar"
    ></div>

    <main class="main">
        <div id="cy" class="cy"></div>
    </main>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
